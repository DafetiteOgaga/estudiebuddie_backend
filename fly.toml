# fly.toml app configuration file generated for estudiebuddie-backend on 2026-01-29T10:35:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'estudiebuddie-backend'
primary_region = 'ams'
console_command = '/code/manage.py shell'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
