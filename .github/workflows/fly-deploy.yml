name: Deploy to Fly

on:
  push:
    branches:
      - fly_io

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Flyctl
        run: flyctl version

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.ACCESS_TOKEN }}