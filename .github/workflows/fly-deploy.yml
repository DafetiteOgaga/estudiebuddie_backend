name: Deploy to Fly

on:
  push:
    branches:
      - fly_io   # change this if your deploy branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: fly deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.ACCESS_TOKEN }}
